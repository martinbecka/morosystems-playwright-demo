name: MoroSystems Playwright Demo

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update and upload Playwright snapshots'
        required: true
        default: false
        type: boolean

jobs:
  tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    name: Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build backend Docker image
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t backend .

      - name: Start backend
        run: |
          docker run -d \
            --name backend \
            -p 8080:8080 \
            backend

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to start"
          docker logs backend
          exit 1

      - name: Generate OpenAPI client
        run: |
          npx openapi-generator-cli generate \
            -i http://localhost:8080/v3/api-docs \
            -g typescript-fetch \
            -o ./openapi

      - name: Quality checks
        run: npm run quality

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            npx playwright test tests/gui/ --update-snapshots
          else
            npx playwright test
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright snapshots
        if: ${{ always() && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots-linux
          path: snapshots/linux/
          retention-days: 30

      - name: Stop backend
        if: ${{ always() }}
        run: docker stop backend || true
